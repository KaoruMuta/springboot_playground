services:
  db:
    container_name: mysql-sample
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: car_site_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: userpass
    volumes: # initialize database
      - ./mysql/my.cnf:/etc/my.cnf
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - '3306:3306'
